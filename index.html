            --accent: #845EC2;
            --dark: #2D1B3D;

        body {

            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Container */
        .container {

            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Picture Frames */
        .pictures-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .picture-frame {
            position: absolute;
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 15px;
            padding: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            opacity: 0;
            transition: opacity 0.6s ease, transform 0.6s ease;
            transform-origin: center;
        }

        .picture-frame.show {
            opacity: 1;
        }

        .picture-frame.top-left {
            top: 30px;
            left: 30px;
        }

        .picture-frame.top-right {
            top: 30px;
            right: 30px;
        }

        .picture-frame.bottom-left {
            bottom: 30px;
            left: 30px;
        }

        .picture-frame.bottom-right {
            bottom: 30px;
            right: 30px;
        }

        @media (max-width: 1024px) {

                width: 90px;
                height: 90px;
                font-size: 2rem;

            .picture-frame.top-left {
                top: 15px;
                left: 15px;
            }

            .picture-frame.top-right {
                top: 15px;
                right: 15px;
            }

            .picture-frame.bottom-left {
                bottom: 15px;
                left: 15px;
            }

            .picture-frame.bottom-right {
                bottom: 15px;
                right: 15px;
            }
        }

        /* Flip Card */
        .flip-card {
            position: absolute;
            width: 90vw;
            max-width: 500px;
            height: 80vh;
            max-height: 700px;
            cursor: pointer;
            perspective: 1000px;
            z-index: 10;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            padding: 3rem 2rem;
            box-shadow: 0 30px 80px rgba(255, 107, 157, 0.2), 0 0 1px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .flip-card-front {
            background: linear-gradient(135deg, #ffffff 0%, #fff9f5 100%);
            border: none;
        }

        .flip-card-back {
            background: linear-gradient(135deg, #ffffff 0%, #fff9f5 100%);
            border: none;
            transform: rotateY(180deg);
        }

        /* Hero Content */
        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slideUp 0.8s ease-out;
        }

        .hero-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slideUp 0.8s ease-out 0.2s both;

        .hero-content p {
            font-size: 1.2rem;
            color: var(--dark);
            margin-bottom: 2rem;
            opacity: 0.8;
            animation: slideUp 0.8s ease-out 0.4s both;

        .tap-hint {
            font-size: 1rem;
            opacity: 0.7;
            font-weight: 500;
            animation: slideUp 0.8s ease-out 0.6s both;
        }

        .tap-indicator {
            display: inline-block;
            animation: pulse 1.5s ease-in-out infinite;
            margin-left: 0.5rem;

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reason-content {

            justify-content: center;

            { text: "You are a bright and beautiful companion to all who know you", emoji: "<img src="DE159079-4A56-41ED-A02B-B7B5F26C3803_4_5005_c.jpeg" alt="pic" style="width:100%; height:100%; object-fit:cover; border-radius:10px;"/>", pics: [""DF9B54C9-C90F-4D6D-A400-3DC9F55B40DF_4_5005_c.jpeg"", ""E049B3C1-E49B-40EC-A033-B14647115198_1_105_c.jpeg"", ""E13EDE46-EFC9-4493-93BF-7A38AE6F68A1_1_105_c.jpeg"", ""E495D2D9-423C-45DA-AD8A-B8DB827C3AA4_4_5005_c.jpeg""] },
            { text: "Your devotion to Radhe Krishna reflects your spiritual depth", emoji: "<img src="E91BD9FA-2F9E-43AD-A60F-50A182FB1DAE_4_5005_c.jpeg" alt="pic" style="width:100%; height:100%; object-fit:cover; border-radius:10px;"/>", pics: [""EA131A7F-C1E3-47FB-B29F-F0066DDA6E9C_4_5005_c.jpeg"️", ""ECB04E1D-627D-4E7E-A79B-FD5402C6D458_4_5005_c.jpeg"", ""EF1217D4-889E-42CA-87F4-D7958E657171_4_5005_c.jpeg"", ""F1756EE7-6FEE-49CC-B8AF-A9FC3FEE32BB_4_5005_c.jpeg"️"] },
            { text: "You're sometimes lovingly stubborn in the most endearing way", emoji: "<img src="F5E6B14C-1B12-4B4B-9F3B-E297A8F43DCA_4_5005_c.jpeg" alt="pic" style="width:100%; height:100%; object-fit:cover; border-radius:10px;"/>", pics: [""F64A2F23-E7E2-4DA3-BC63-C5431BC3DBC5_1_105_c.jpeg"", ""F6A9630B-B281-46E8-BE31-78A04316BA7B_4_5005_c.jpeg"", ""F6EE1EB2-F183-4D8F-AFC1-043094E10B3C_4_5005_c.jpeg"", ""F84305B2-0334-487D-8FEF-46F003FE1F5D_4_5005_c.jpeg""] },
            { text: "You are gorgeous, gorgeous, gorgeous inside and out", emoji: "<img src="FB3937CE-CD78-4C66-9549-6F7AB0B1CF89_4_5005_c.jpeg" alt="pic" style="width:100%; height:100%; object-fit:cover; border-radius:10px;"/>", pics: [""FCD0604E-97AF-4A73-980C-702CF104F81B_1_105_c.jpeg"", "💫", "💖", "🌟"] },
            { text: "You are an empathetic doctor yet maintain your professionalism", emoji: "❤️", pics: ["👩‍⚕️", "💕", "🤝", "💉"] },
            { text: "You love your sleep and we totally respect your need for rest", emoji: "😴", pics: ["🛏️", "💤", "🌙", "😴"] },
            { text: "Your love for dosa, idli, and Chinese food shows your amazing taste", emoji: "🍜", pics: ["🥘", "🍲", "🍱", "😋"] },
            { text: "You are beautiful inside and out in every way possible", emoji: "💖", pics: ["✨", "💫", "🌸", "👸"] },
            { text: "You are charming and attractive in all respects", emoji: "✨", pics: ["💅", "👑", "💕", "🌟"] },
            { text: "You are understanding and helpful to everyone around you, and you are a blessing to mom and me", emoji: "🙌", pics: ["💕", "🤗", "👨‍👩‍👧", "❤️"] }
        ];

        let currentCard = -1; // -1 for hero, 0-24 for reasons, 25 for final
        const totalCards = reasons.length + 2; // hero + 25 reasons + final
        const flipCard = document.getElementById('flipCard');
        const flipCardBack = flipCard.querySelector('.flip-card-back');
        const reasonContent = document.getElementById('reasonContent');

        const pictureFrames = {
            topLeft: document.getElementById('picTopLeft'),
            topRight: document.getElementById('picTopRight'),
            bottomLeft: document.getElementById('picBottomLeft'),
            bottomRight: document.getElementById('picBottomRight')
        };

        function updatePictures() {
            // Hide all pictures first
            Object.values(pictureFrames).forEach(pic => {
                pic.classList.remove('show');
            });

            // Show new pictures after a short delay
            setTimeout(() => {
                if (currentCard === -1) {
                    // Hero screen - show generic celebration pics
                    const heroEmojis = ['🎉', '🎂', '🎁', '🎈'];
                    pictureFrames.topLeft.textContent = heroEmojis[0];
                    pictureFrames.topRight.textContent = heroEmojis[1];
                    pictureFrames.bottomLeft.textContent = heroEmojis[2];
                    pictureFrames.bottomRight.textContent = heroEmojis[3];
                } else if (currentCard >= 0 && currentCard < reasons.length) {
                    // Show reason-specific pictures
                    const pics = reasons[currentCard].pics;
                    pictureFrames.topLeft.textContent = pics[0];
                    pictureFrames.topRight.textContent = pics[1];
                    pictureFrames.bottomLeft.textContent = pics[2];
                    pictureFrames.bottomRight.textContent = pics[3];
                } else if (currentCard === reasons.length) {
                    // Final screen - show celebration pics
                    const finalEmojis = ['🎊', '🎉', '💖', '✨'];
                    pictureFrames.topLeft.textContent = finalEmojis[0];
                    pictureFrames.topRight.textContent = finalEmojis[1];
                    pictureFrames.bottomLeft.textContent = finalEmojis[2];
                    pictureFrames.bottomRight.textContent = finalEmojis[3];
                }

                // Add show class to display them
                Object.values(pictureFrames).forEach(pic => {
                    pic.classList.add('show');
                });
            }, 100);
        }

        function updateProgress() {
            const percent = ((currentCard + 1) / totalCards) * 100;
            document.getElementById('progressBar').style.width = percent + '%';
            
            let text = '';
            if (currentCard === -1) {
                text = 'Click to start!';
            } else if (currentCard >= 0 && currentCard < reasons.length) {
                text = `Reason ${currentCard + 1} of 25`;
            } else {
                text = 'The End! 💖';
            }
            document.getElementById('progressText').textContent = text;
        }

        function updateCard() {
            if (currentCard === reasons.length) {
                // Show final screen
                flipCardBack.innerHTML = `
                    <div class="final-content">
                        <h2>You're Not Just a Doctor... 💙</h2>
                        <p>
                            You're a role model, a friend, a light in the darkness, and the person we admire most.
                            <br><br>
                            <span class="heart-wave">💖</span>
                            <span class="heart-wave">💖</span>
                            <span class="heart-wave">💖</span>
                            <br><br>
                            Thank you for being YOU. Happy Birthday, Anusha!
                            <br><br>
                            With all our love,
                            <br>
                            Mom and Bhaodude
                        </p>
                    </div>
                `;
                createConfetti();
            } else if (currentCard >= 0 && currentCard < reasons.length) {
                // Show reason
                const reason = reasons[currentCard];
                reasonContent.innerHTML = `
                    <div class="reason-emoji">${reason.emoji}</div>
                    <div class="reason-number">${String(currentCard + 1).padStart(2, '0')}</div>
                    <div class="reason-text">${reason.text}</div>
                `;
                
                // Trigger confetti on milestone cards
                if ((currentCard + 1) % 5 === 0) {
                    createConfetti();
                }
            }

            updatePictures();
            updateProgress();
        }

        function nextCard() {
            if (currentCard < reasons.length) {
                currentCard++;
                flipCard.classList.remove('flipped');
                
                // Small delay to ensure card flips back first
                setTimeout(() => {
                    updateCard();
                    flipCard.classList.add('flipped');
                }, 50);
            }
        }

        // Click on card to navigate
        flipCard.addEventListener('click', () => {
            if (currentCard === -1) {
                // First click: flip to show reason 1
                currentCard++;
                updateCard();
                flipCard.classList.add('flipped');
            } else if (currentCard < reasons.length) {
                // Next clicks: flip back and forth, advance to next reason
                nextCard();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                if (currentCard < reasons.length) {
                    nextCard();
                }
            }
        });

        function createConfetti() {
            const colors = ['#FF6B9D', '#FFC75F', '#845EC2', '#00C9A7', '#F7F0FF'];
            const confettiCount = 40;

            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '50%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.borderRadius = '50%';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 0.3 + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 5000);
            }
        }

        // Initialize - show hero pictures and confetti
        window.addEventListener('load', () => {
            setTimeout(() => {
                updatePictures();
                createConfetti();
            }, 300);
        });

        updateProgress();
    </script>

</body>
