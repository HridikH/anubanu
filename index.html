<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Anusha! 🎉</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B9D;
            --secondary: #FFC75F;
            --accent: #845EC2;
            --dark: #2D1B3D;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fff9e6 0%, #ffe6f0 50%, #f0e6ff 100%);
            color: var(--dark);
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Container */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Picture Frames */
        .pictures-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .picture-frame {
            position: absolute;
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 15px;
            padding: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            opacity: 0;
            transition: opacity 0.6s ease, transform 0.6s ease;
            transform-origin: center;
        }

        .picture-frame.show {
            opacity: 1;
        }

        .picture-frame.top-left {
            top: 30px;
            left: 30px;
        }

        .picture-frame.top-right {
            top: 30px;
            right: 30px;
        }

        .picture-frame.bottom-left {
            bottom: 30px;
            left: 30px;
        }

        .picture-frame.bottom-right {
            bottom: 30px;
            right: 30px;
        }

        @media (max-width: 1024px) {
            .picture-frame {
                width: 90px;
                height: 90px;
                font-size: 2rem;
            }

            .picture-frame.top-left {
                top: 15px;
                left: 15px;
            }

            .picture-frame.top-right {
                top: 15px;
                right: 15px;
            }

            .picture-frame.bottom-left {
                bottom: 15px;
                left: 15px;
            }

            .picture-frame.bottom-right {
                bottom: 15px;
                right: 15px;
            }
        }

        /* Flip Card */
        .flip-card {
            position: absolute;
            width: 90vw;
            max-width: 500px;
            height: 80vh;
            max-height: 700px;
            cursor: pointer;
            perspective: 1000px;
            z-index: 10;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            padding: 3rem 2rem;
            box-shadow: 0 30px 80px rgba(255, 107, 157, 0.2), 0 0 1px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .flip-card-front {
            background: linear-gradient(135deg, #ffffff 0%, #fff9f5 100%);
            border: none;
        }

        .flip-card-back {
            background: linear-gradient(135deg, #ffffff 0%, #fff9f5 100%);
            border: none;
            transform: rotateY(180deg);
        }

        /* Hero Content */
        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slideUp 0.8s ease-out;
        }

        .hero-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        .hero-content p {
            font-size: 1.2rem;
            color: var(--dark);
            margin-bottom: 2rem;
            opacity: 0.8;
            animation: slideUp 0.8s ease-out 0.4s both;
        }

        .tap-hint {
            font-size: 1rem;
            opacity: 0.7;
            font-weight: 500;
            animation: slideUp 0.8s ease-out 0.6s both;
        }

        .tap-indicator {
            display: inline-block;
            animation: pulse 1.5s ease-in-out infinite;
            margin-left: 0.5rem;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Reason Card Content */
        .reason-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .reason-emoji {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.08));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotateZ(0deg); }
            50% { transform: translateY(-20px) rotateZ(8deg); }
        }

        .reason-number {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .reason-text {
            font-size: 1.3rem;
            color: var(--dark);
            line-height: 1.8;
            font-weight: 600;
            letter-spacing: -0.3px;
            max-width: 90%;
        }

        /* End Screen */
        .final-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            animation: slideUp 0.8s ease-out;
        }

        .final-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .final-content p {
            font-size: 1.1rem;
            color: var(--dark);
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }

        .heart-wave {
            display: inline-block;
            animation: wave 1.5s ease-in-out infinite;
            margin: 0 0.3rem;
        }

        @keyframes wave {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* Progress Bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            transition: width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 15;
            box-shadow: 0 2px 10px rgba(255, 107, 157, 0.2);
        }

        .progress-text {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: var(--dark);
            font-weight: 700;
            z-index: 15;
            background: white;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            letter-spacing: 0.3px;
        }

        /* Confetti */
        @keyframes confetti-fall {
            0% {
                transform: translateY(-10vh) rotateZ(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotateZ(720deg) scale(0);
                opacity: 0;
            }
        }

        .confetti {
            position: fixed;
            pointer-events: none;
            animation: confetti-fall linear forwards;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 2.5rem;
            }

            .hero-content h2 {
                font-size: 2rem;
            }

            .reason-number {
                font-size: 2.5rem;
            }

            .reason-text {
                font-size: 1rem;
            }

            .reason-emoji {
                font-size: 3rem;
            }

            .final-content h2 {
                font-size: 1.8rem;
            }

            .final-content p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <!-- Progress Bar -->
    <div class="progress-bar" id="progressBar"></div>
    <div class="progress-text" id="progressText">Click to start!</div>

    <!-- Picture Frames -->
    <div class="pictures-container">
        <div class="picture-frame top-left" id="picTopLeft">📷</div>
        <div class="picture-frame top-right" id="picTopRight">📸</div>
        <div class="picture-frame bottom-left" id="picBottomLeft">🎂</div>
        <div class="picture-frame bottom-right" id="picBottomRight">💕</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="flip-card" id="flipCard">
            <div class="flip-card-inner">
                <!-- Front: Hero -->
                <div class="flip-card-front">
                    <div class="hero-content">
                        <h1>Happy Birthday <span style="animation: bounce 2s ease-in-out infinite;">🎉</span></h1>
                        <h2>Anusha</h2>
                        <p>Our amazing doctor & inspiration</p>
                        <div class="tap-hint">
                            Click the card to begin
                            <span class="tap-indicator">👆</span>
                        </div>
                    </div>
                </div>

                <!-- Back: First Reason (will be replaced) -->
                <div class="flip-card-back">
                    <div class="reason-content" id="reasonContent">
                        <div class="reason-emoji">✨</div>
                        <div class="reason-number">01</div>
                        <div class="reason-text">You are the most wonderful, beautiful, thoughtful and fun human being</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 25 Reasons with different decorations
        const reasons = [
            { text: "You are the most wonderful, beautiful, thoughtful and fun human being", emoji: "✨", pics: ["😊", "💝", "🌟", "💫"] },
            { text: "You have a golden heart that shines through everything you do", emoji: "💛", pics: ["💛", "✨", "💖", "🌟"] },
            { text: "You are intelligent and smart in ways that inspire us all", emoji: "🧠", pics: ["📚", "💡", "🎓", "📖"] },
            { text: "Your magnetic smile and drop-dead good looks light up every room", emoji: "😊", pics: ["✨", "💫", "😍", "🌟"] },
            { text: "You have a rocking personality that draws everyone in", emoji: "🎸", pics: ["🎉", "😎", "💃", "🎊"] },
            { text: "You are a brilliant doctor who truly cares about your patients", emoji: "👩‍⚕️", pics: ["🏥", "💉", "🩺", "❤️"] },
            { text: "You are an amazing daughter who makes mom so proud", emoji: "👧", pics: ["💕", "👩", "🏠", "❤️"] },
            { text: "You are an amazing sister and I'm lucky to have you as my sibling", emoji: "👭", pics: ["💕", "🤗", "👨‍👩‍👧", "💖"] },
            { text: "Your lovely doe-like eyes and you're the apple of mom's eye (and mine too!)", emoji: "👁️", pics: ["👀", "💕", "👑", "✨"] },
            { text: "You are a dear and loyal friend who always shows up when it matters", emoji: "🤝", pics: ["👭", "💕", "🤗", "❤️"] },
            { text: "You are a graceful dancer who moves with such elegance", emoji: "💃", pics: ["🎭", "🎶", "✨", "🌟"] },
            { text: "Your golden heart touches everyone around you with kindness", emoji: "💛", pics: ["💛", "🙏", "💕", "✨"] },
            { text: "You have a melodious voice when you sing", emoji: "🎤", pics: ["🎵", "🎶", "🎼", "🎧"] },
            { text: "You are a connoisseur of dance and truly appreciate the art form", emoji: "🩰", pics: ["💃", "🎭", "✨", "🎪"] },
            { text: "You are a spirited and brave young woman who faces challenges head-on", emoji: "💪", pics: ["🏔️", "🔥", "⭐", "💪"] },
            { text: "You are a bright and beautiful companion to all who know you", emoji: "🌟", pics: ["✨", "💫", "🌈", "💕"] },
            { text: "Your devotion to Radhe Krishna reflects your spiritual depth", emoji: "🙏", pics: ["🕉️", "💕", "✨", "☮️"] },
            { text: "You're sometimes lovingly stubborn in the most endearing way", emoji: "😄", pics: ["😜", "😎", "💪", "👑"] },
            { text: "You are gorgeous, gorgeous, gorgeous inside and out", emoji: "👑", pics: ["✨", "💫", "💖", "🌟"] },
            { text: "You are an empathetic doctor yet maintain your professionalism", emoji: "❤️", pics: ["👩‍⚕️", "💕", "🤝", "💉"] },
            { text: "You love your sleep and we totally respect your need for rest", emoji: "😴", pics: ["🛏️", "💤", "🌙", "😴"] },
            { text: "Your love for dosa, idli, and Chinese food shows your amazing taste", emoji: "🍜", pics: ["🥘", "🍲", "🍱", "😋"] },
            { text: "You are beautiful inside and out in every way possible", emoji: "💖", pics: ["✨", "💫", "🌸", "👸"] },
            { text: "You are charming and attractive in all respects", emoji: "✨", pics: ["💅", "👑", "💕", "🌟"] },
            { text: "You are understanding and helpful to everyone around you, and you are a blessing to mom and me", emoji: "🙌", pics: ["💕", "🤗", "👨‍👩‍👧", "❤️"] }
        ];

        let currentCard = -1; // -1 for hero, 0-24 for reasons, 25 for final
        const totalCards = reasons.length + 2; // hero + 25 reasons + final
        const flipCard = document.getElementById('flipCard');
        const flipCardBack = flipCard.querySelector('.flip-card-back');
        const reasonContent = document.getElementById('reasonContent');

        const pictureFrames = {
            topLeft: document.getElementById('picTopLeft'),
            topRight: document.getElementById('picTopRight'),
            bottomLeft: document.getElementById('picBottomLeft'),
            bottomRight: document.getElementById('picBottomRight')
        };

        function updatePictures() {
            // Hide all pictures first
            Object.values(pictureFrames).forEach(pic => {
                pic.classList.remove('show');
            });

            // Show new pictures after a short delay
            setTimeout(() => {
                if (currentCard === -1) {
                    // Hero screen - show generic celebration pics
                    const heroEmojis = ['🎉', '🎂', '🎁', '🎈'];
                    pictureFrames.topLeft.textContent = heroEmojis[0];
                    pictureFrames.topRight.textContent = heroEmojis[1];
                    pictureFrames.bottomLeft.textContent = heroEmojis[2];
                    pictureFrames.bottomRight.textContent = heroEmojis[3];
                } else if (currentCard >= 0 && currentCard < reasons.length) {
                    // Show reason-specific pictures
                    const pics = reasons[currentCard].pics;
                    pictureFrames.topLeft.textContent = pics[0];
                    pictureFrames.topRight.textContent = pics[1];
                    pictureFrames.bottomLeft.textContent = pics[2];
                    pictureFrames.bottomRight.textContent = pics[3];
                } else if (currentCard === reasons.length) {
                    // Final screen - show celebration pics
                    const finalEmojis = ['🎊', '🎉', '💖', '✨'];
                    pictureFrames.topLeft.textContent = finalEmojis[0];
                    pictureFrames.topRight.textContent = finalEmojis[1];
                    pictureFrames.bottomLeft.textContent = finalEmojis[2];
                    pictureFrames.bottomRight.textContent = finalEmojis[3];
                }

                // Add show class to display them
                Object.values(pictureFrames).forEach(pic => {
                    pic.classList.add('show');
                });
            }, 100);
        }

        function updateProgress() {
            const percent = ((currentCard + 1) / totalCards) * 100;
            document.getElementById('progressBar').style.width = percent + '%';
            
            let text = '';
            if (currentCard === -1) {
                text = 'Click to start!';
            } else if (currentCard >= 0 && currentCard < reasons.length) {
                text = `Reason ${currentCard + 1} of 25`;
            } else {
                text = 'The End! 💖';
            }
            document.getElementById('progressText').textContent = text;
        }

        function updateCard() {
            if (currentCard === reasons.length) {
                // Show final screen
                flipCardBack.innerHTML = `
                    <div class="final-content">
                        <h2>You're Not Just a Doctor... 💙</h2>
                        <p>
                            You're a role model, a friend, a light in the darkness, and the person we admire most.
                            <br><br>
                            <span class="heart-wave">💖</span>
                            <span class="heart-wave">💖</span>
                            <span class="heart-wave">💖</span>
                            <br><br>
                            Thank you for being YOU. Happy Birthday, Anusha!
                            <br><br>
                            With all our love,
                            <br>
                            Mom and Bhaodude
                        </p>
                    </div>
                `;
                createConfetti();
            } else if (currentCard >= 0 && currentCard < reasons.length) {
                // Show reason
                const reason = reasons[currentCard];
                reasonContent.innerHTML = `
                    <div class="reason-emoji">${reason.emoji}</div>
                    <div class="reason-number">${String(currentCard + 1).padStart(2, '0')}</div>
                    <div class="reason-text">${reason.text}</div>
                `;
                
                // Trigger confetti on milestone cards
                if ((currentCard + 1) % 5 === 0) {
                    createConfetti();
                }
            }

            updatePictures();
            updateProgress();
        }

        function nextCard() {
            if (currentCard < reasons.length) {
                currentCard++;
                flipCard.classList.remove('flipped');
                
                // Small delay to ensure card flips back first
                setTimeout(() => {
                    updateCard();
                    flipCard.classList.add('flipped');
                }, 50);
            }
        }

        // Click on card to navigate
        flipCard.addEventListener('click', () => {
            if (currentCard === -1) {
                // First click: flip to show reason 1
                currentCard++;
                updateCard();
                flipCard.classList.add('flipped');
            } else if (currentCard < reasons.length) {
                // Next clicks: flip back and forth, advance to next reason
                nextCard();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                if (currentCard < reasons.length) {
                    nextCard();
                }
            }
        });

        function createConfetti() {
            const colors = ['#FF6B9D', '#FFC75F', '#845EC2', '#00C9A7', '#F7F0FF'];
            const confettiCount = 40;

            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '50%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.borderRadius = '50%';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 0.3 + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 5000);
            }
        }

        // Initialize - show hero pictures and confetti
        window.addEventListener('load', () => {
            setTimeout(() => {
                updatePictures();
                createConfetti();
            }, 300);
        });

        updateProgress();
    </script>

</body>
</html>
